name: Build & Release ZIP

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Determine release metadata ────────────────────────────────────────
      - name: Set release info
        id: info
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="Alien AI Trader ${TAG}"
            PRERELEASE="false"
          else
            TAG="latest"
            RELEASE_NAME="Alien AI Trader — Latest Build"
            PRERELEASE="true"
          fi
          ZIPNAME="AlienAITrader-${TAG}.zip"
          echo "TAG=${TAG}"           >> $GITHUB_ENV
          echo "ZIPNAME=${ZIPNAME}"   >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "PRERELEASE=${PRERELEASE}"     >> $GITHUB_ENV

      # ── Build the distributable ZIP ───────────────────────────────────────
      - name: Build distributable ZIP
        run: |
          mkdir -p staging/Alien_AI_Trader

          rsync -av . staging/Alien_AI_Trader/ \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".claude" \
            --exclude=".venv" \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            --exclude="*.pyo" \
            --exclude="*.pyd" \
            --exclude="*.db" \
            --exclude="*.sqlite3" \
            --exclude="*.log" \
            --exclude="keys.bat" \
            --exclude=".env" \
            --exclude="config.json" \
            --exclude="trading_settings.json" \
            --exclude="install_config.json" \
            --exclude="backup files zipped" \
            --exclude="staging"

          cd staging
          zip -r "../${ZIPNAME}" Alien_AI_Trader/
          cd ..

      # ── Create or update the GitHub Release ──────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ env.TAG }}
          name:       ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.PRERELEASE }}
          files:      ${{ env.ZIPNAME }}
          body: |
            ## ${{ env.RELEASE_NAME }}

            ### Download & Install (Windows 10 / 11)

            1. Download **`${{ env.ZIPNAME }}`** below
            2. Right-click the ZIP → **Extract All** → pick any folder (e.g. Desktop)
            3. Open the extracted `Alien_AI_Trader` folder
            4. Double-click **`LAUNCH.bat`**
            5. Choose **[1] Install** — the wizard installs Python, packages, and walks you through your API keys
            6. The dashboard opens at **http://localhost:5000** automatically

            ### Daily Launch
            After the first install, use the **"Alien AI Trader"** shortcut on your Desktop
            or double-click `START.bat` inside the install folder.

            ### What's Inside
            | Feature | Details |
            |---------|---------|
            | Live market scanning | Scans every 15 s with RSI, SMA, MACD, Bollinger Bands, VWAP |
            | Predictive forecasting | Linear regression + EMA stacking — buys on confirmed climbs, exits early at the peak |
            | Ladder scoring | Composite 0-100 score ranks every symbol; only top-tier stocks are bought |
            | Trailing stop | Holds position while climbing; sells automatically when it starts dropping |
            | Settings persistence | All dashboard settings saved to disk — survive restarts |
            | Session recycling | Scanning restarts every 5 h 59 min to avoid API charges |
            | Paper & Live trading | Paper trading by default; live requires explicit opt-in |
            | Alerts | Pushover, Pushbullet, Twilio SMS/voice for crashes and rockets |
            | Cloud deploy | One-click Render.com deployment via `render.yaml` |

            ### Cloud Version (Render)
            **https://alien-ai-trader-dashboard.onrender.com**

            ---
            Built by Troy Walker · T-Dub's Apps · 2026
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
