services:
  # -- Web Dashboard -------------------------------------------------------
  - type: web
    name: alien-ai-trader-dashboard
    runtime: python
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # gevent worker class is REQUIRED for Socket.IO WebSocket support.
    # gthread does not support WebSockets and will break live dashboard updates.
    startCommand: gunicorn --worker-class gevent --workers 1 --bind 0.0.0.0:$PORT dashboard:app
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      # -- API Keys (set manually in Render dashboard) ----------------------
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
      - key: ALPACA_BASE_URL
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: PUSHBULLET_API_KEY
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
      - key: PUSHOVER_USER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        sync: false
      # -- Trading mode -----------------------------------------------------
      - key: TRADING_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: ENGINE_MODE
        value: AI
      # -- Stock list -------------------------------------------------------
      - key: STOCK_LIST
        value: AAPL,GOOG,TSLA,MSFT,AMZN
      # -- Scan & execution -------------------------------------------------
      - key: POLL_SECONDS
        value: "30"         # safe: daily bars cached 30min, only live prices hit API
      - key: SCAN_WORKERS
        value: "8"
      - key: TRAILING_STOP_PCT
        value: "3.0"
      - key: LOSS_THRESHOLD
        value: "5.0"
      - key: MAX_POSITIONS
        value: "5"
      - key: SCAN_ALL_MARKET
        value: "true"       # safe now: list_assets cached 10min, bars cached 30min
      - key: MARKET_SCAN_CANDIDATES
        value: "20"
      - key: MAX_TRADES_PER_HOUR
        value: "10"
      - key: ORDER_QTY
        value: "1"
      # -- Capital & position sizing ----------------------------------------
      - key: INITIAL_CAPITAL
        value: "0"
      - key: RISK_PER_TRADE_PCT
        value: "2.0"
      - key: MAX_POSITION_PCT
        value: "20.0"
      - key: MIN_POSITIONS
        value: "5"
      - key: RISK_PER_TRADE_USD
        value: "0"
      # -- Signal filters ---------------------------------------------------
      - key: RSI_BUY_MAX
        value: "50.0"
      - key: RSI_SELL_MIN
        value: "70.0"
      - key: SMA_SPREAD_MIN
        value: "0.1"
      # -- Portfolio ladder -------------------------------------------------
      - key: LADDER_INTERVAL
        value: "120"        # rescore every 2 min — keeps AV calls well within free limit
      - key: MIN_SCORE_TO_BUY
        value: "45.0"
      - key: TOP_TIER_PCT
        value: "0.20"
      - key: BOTTOM_TIER_PCT
        value: "0.20"
      # -- Alerts & heartbeat -----------------------------------------------
      - key: AFTERHOURS_DROP_PCT
        value: "3"
      - key: ROCKET_ALERT_PCT
        value: "5"
      - key: DASHBOARD_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      # -- Integrated engine (formerly worker-only settings) ----------------
      - key: RUN_SECONDS
        value: "21540"
      - key: HEARTBEAT_EVERY_SECONDS
        value: "10"
      # -- Engine runs inside the dashboard process (no separate worker needed) --
      - key: DISABLE_INTEGRATED_ENGINE
        value: "false"
      # -- Market hours only: engine pauses outside 9:30-16:00 ET Mon-Fri ------
      - key: MARKET_HOURS_ONLY
        value: "true"

# Built by Troy Walker of T-Dub's Apps -- 2026-04-28
# 2026-06: Collapsed to single-service architecture. Worker service suspended on Render.
#          Engine runs inside dashboard process. Saves ~$7/mo.
# (sync:false means it will NOT auto-populate from this file)
