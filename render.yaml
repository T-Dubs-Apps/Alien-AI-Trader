services:
  # ── Web Dashboard ──────────────────────────────────────────────────────────
  - type: web
    name: alien-ai-trader-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --bind 0.0.0.0:$PORT dashboard:app
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: PUSHBULLET_TOKEN
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
      - key: PUSHOVER_USER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        sync: false
      - key: TRADING_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: STOCK_LIST
        value: AAPL,GOOG,TSLA,MSFT,AMZN
      - key: ENGINE_MODE
        value: AI
      - key: POLL_SECONDS
        value: "15"
      - key: SCAN_WORKERS
        value: "8"
      - key: TRAILING_STOP_PCT
        value: "3.0"
      - key: LOSS_THRESHOLD
        value: "5.0"
      - key: INITIAL_CAPITAL
        value: "0"
      - key: MAX_POSITIONS
        value: "5"
      - key: SCAN_ALL_MARKET
        value: "false"
      - key: MARKET_SCAN_CANDIDATES
        value: "30"
      - key: MAX_TRADES_PER_HOUR
        value: "30"
      - key: ORDER_QTY
        value: "1"
      - key: AFTERHOURS_DROP_PCT
        value: "3"
      - key: ROCKET_ALERT_PCT
        value: "5"
      - key: HEARTBEAT_EVERY_SECONDS
        value: "10"
      - key: DASHBOARD_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

  # ── Background Worker ───────────────────────────────────────────────────────
  - type: worker
    name: alien-ai-trader-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: PUSHBULLET_TOKEN
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
      - key: PUSHOVER_USER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        sync: false
      - key: TRADING_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: STOCK_LIST
        value: AAPL,GOOG,TSLA,MSFT,AMZN
      - key: ENGINE_MODE
        value: AI
      - key: POLL_SECONDS
        value: "15"
      - key: SCAN_WORKERS
        value: "8"
      - key: TRAILING_STOP_PCT
        value: "3.0"
      - key: LOSS_THRESHOLD
        value: "5.0"
      - key: INITIAL_CAPITAL
        value: "0"
      - key: MAX_POSITIONS
        value: "5"
      - key: SCAN_ALL_MARKET
        value: "false"
      - key: MARKET_SCAN_CANDIDATES
        value: "30"
      - key: MAX_TRADES_PER_HOUR
        value: "30"
      - key: ORDER_QTY
        value: "1"
      - key: AFTERHOURS_DROP_PCT
        value: "3"
      - key: ROCKET_ALERT_PCT
        value: "5"
      - key: DASHBOARD_BASE_URL
        sync: false

