# ═══════════════════════════════════════════════════════════════════════════
#  Alien AI Trader — Render Blueprint
#  Built by Troy Walker of T-Dub's Apps
# ═══════════════════════════════════════════════════════════════════════════
#
#  DEPLOY FIRST, KEYS SECOND.
#
#  Render's Blueprint form makes you fill in every variable marked `sync: false`
#  BEFORE it will create your service. So this file asks for exactly one thing:
#  a password to lock your own dashboard. Everything else — your Alpaca and
#  Alpha Vantage keys, your stock list, your risk settings — is entered inside
#  the running app afterwards, in Settings → Setup.
#
#  That order matters: you cannot get Alpaca or Alpha Vantage keys until you
#  have somewhere to put them, and you shouldn't have to hand them to a form
#  before you've even seen the app.
#
#  WHAT YOU NEED (all free, all in your own name):
#    1. A Render account            → runs the app
#    2. An Alpaca PAPER account     → https://alpaca.markets  (practice money)
#    3. An Alpha Vantage API key    → https://www.alphavantage.co/support/#api-key
#
#  Steps 2 and 3 happen AFTER this deploys. The app boots, shows a setup panel,
#  and starts trading within ~30 seconds of you saving your keys. No redeploy.
#
#  SAFETY — please read:
#    • This app starts in PAPER mode (practice money). It always will.
#    • Real-money trading stays off until you have a paid license AND you add
#      separate live keys AND you turn it on yourself. Three deliberate steps.
#    • Trading carries real risk of loss. See RISK_DISCLOSURE.md and
#      LIVE_TRADING_CONSENT.md before you ever enable live mode.
#    • This deployment is YOURS. It runs in your Render account, on your keys,
#      under your control. The author cannot see it, reach it, or change it.
#      Keeping it secure — and every setting in it — is your responsibility.
# ═══════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: alien-ai-trader
    runtime: python
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # gevent worker class is REQUIRED for Socket.IO WebSocket support.
    # gthread does not support WebSockets and will break live dashboard updates.
    startCommand: gunicorn --worker-class gevent --workers 1 --bind 0.0.0.0:$PORT dashboard:app

    envVars:
      # ─────────────────────────────────────────────────────────────────────
      #  THE ONLY THING YOU MUST ENTER NOW
      # ─────────────────────────────────────────────────────────────────────
      # Your dashboard password. Pick a strong one you don't use anywhere else.
      #
      # This is the ONLY thing standing between the internet and your trading
      # account — your Render URL is public, and without this anyone who finds
      # it could place orders. It is required for exactly that reason.
      - key: DASHBOARD_PASSWORD
        sync: false

      # ─────────────────────────────────────────────────────────────────────
      #  SET AUTOMATICALLY — nothing for you to do
      # ─────────────────────────────────────────────────────────────────────
      # Pinned runtime; avoids automatic jumps to new Python majors that can
      # break broker/data SDK compatibility.
      - key: PYTHON_VERSION
        value: 3.11.9

      # Session signing key, generated uniquely for your deployment.
      - key: FLASK_SECRET
        generateValue: true

      # Boot mode. The real control is the in-app Paper↔Live toggle, which is
      # license-gated. Keeping this 'paper' means every deployment starts safe.
      - key: TRADING_MODE
        value: paper

      - key: LIVE_TRADING_ENABLED
        value: "false"

      - key: ENGINE_MODE
        value: AI

      # Market data feed. IEX works on every Alpaca plan; SIP needs a paid
      # data subscription with Alpaca. Change it in the app if you have SIP.
      - key: ALPACA_DATA_FEED
        value: iex

      # Your deployment runs the trading app only. It does not run the license
      # server, the store, Stripe webhooks or any admin console — those exist
      # solely on the author's deployment. Leaving this as 'client' means there
      # is no payment or licensing machinery in your service to be attacked,
      # and nothing of the author's is present in your account.
      - key: APP_ROLE
        value: client

# ═══════════════════════════════════════════════════════════════════════════
#  EVERYTHING ELSE IS OPTIONAL — and you add it INSIDE the app, not here
# ═══════════════════════════════════════════════════════════════════════════
#
#  Required to trade (Settings → Setup, after this deploys):
#    ALPACA_KEY / ALPACA_SECRET   your Alpaca PAPER key pair
#    ALPHA_VANTAGE_KEY            your Alpha Vantage key
#
#  Optional, whenever you want them (Settings):
#    Stock list, poll speed, trailing stop, loss threshold, position limits,
#    market-hours-only, risk profile — all editable live in the app.
#
#  Optional extras (offered to you later as an in-app update, never required):
#    ALPACA_LIVE_KEY / ALPACA_LIVE_SECRET   real-money keys (licensed plans)
#    PUSHBULLET_TOKEN / PUSHOVER_*          phone alerts
#    TWILIO_*                               SMS alerts
#    LICENSE_EMAIL                          auto-restores a paid license on boot
#
#  You will never be asked for anything belonging to the app author, and no
#  update will ever contain the author's keys or secrets.
#
#  ── OPTIONAL: keep settings across redeploys ────────────────────────────────
#  Without a disk, your saved keys and settings reset when Render redeploys and
#  you re-enter them once. With a disk they persist exactly as you left them.
#  Requires a PAID Render instance — free web services cannot mount a disk.
#  All Render charges are your own account's responsibility.
#
#  To enable: uncomment the DATA_DIR var (indented under envVars above) and the
#  disk block (indented under the service), like this:
#
#      - key: DATA_DIR
#        value: /var/data
#
#    disk:
#      name: aat-data
#      mountPath: /var/data
#      sizeGB: 1
# ═══════════════════════════════════════════════════════════════════════════
